
name: Pesquisador Roby Miner AI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  pesquisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar pesquisador
        run: python pesquisador.py

      - name: Salvar relatório atualizado
        run: |
          git config user.name "Roby Miner AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorio.json
          git diff --cached --quiet || git commit -m "Atualizar relatório de oportunidades"
          git push
