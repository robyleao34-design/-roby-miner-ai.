
name: Roby Miner AI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar Roby Miner AI
        run: python app.py
